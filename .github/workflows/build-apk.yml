
name: Build COBRA AI PRO APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "IMG-20261103-WA6712.jpg"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/muhajirhackers/cobraaipro
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          if [ ! -f IMG-20261103-WA6712.jpg ]; then
            echo "ERROR: Please upload IMG-20261103-WA6712.jpg to the repository root."
            exit 1
          fi

          convert IMG-20261103-WA6712.jpg \
            -resize 512x512^ -gravity center -extent 512x512 \
            app/src/main/res/drawable/cobra_logo.jpg

          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            convert IMG-20261103-WA6712.jpg \
              -resize "${size}x${size}^" -gravity center -extent "${size}x${size}" \
              "app/src/main/res/mipmap-${density}/ic_launcher.png"
          done

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "COBRA-AI-PRO"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.muhajirhackers.cobraaipro'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.muhajirhackers.cobraaipro'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#D4AF37</item>
                  <item name="android:statusBarColor">#050505</item>
                  <item name="android:navigationBarColor">#050505</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowBackground">#050505</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@style/AppTheme"
                  android:label="COBRA AI PRO"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/muhajirhackers/cobraaipro/MainActivity.java <<'EOF'
          package com.muhajirhackers.cobraaipro;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.ImageView;
          import android.widget.FrameLayout;
          import android.graphics.drawable.GradientDrawable;

          public class MainActivity extends Activity {

              WebView webView;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);

                  showWelcome();

                  new Handler().postDelayed(() -> openWebsite(), 2500);
              }

              void showWelcome() {
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(24, 35, 24, 35);
                  layout.setBackgroundColor(Color.rgb(5,5,5));

                  GradientDrawable border = new GradientDrawable();
                  border.setColor(Color.rgb(5,5,5));
                  border.setStroke(3, Color.rgb(212,175,55));
                  border.setCornerRadius(28);

                  FrameLayout logoFrame = new FrameLayout(this);
                  logoFrame.setBackground(border);
                  logoFrame.setPadding(5,5,5,5);

                  ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.cobra_logo);
                  logo.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  logoFrame.addView(logo, new FrameLayout.LayoutParams(240,240));

                  layout.addView(logoFrame);

                  TextView title = new TextView(this);
                  title.setText("COBRA AI PRO");
                  title.setTextSize(32);
                  title.setTextColor(Color.rgb(255,205,65));
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0,25,0,8);
                  layout.addView(title);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("NEXT GENERATION ARTIFICIAL INTELLIGENCE");
                  subtitle.setTextSize(11);
                  subtitle.setTextColor(Color.LTGRAY);
                  subtitle.setGravity(Gravity.CENTER);
                  layout.addView(subtitle);

                  TextView founder = new TextView(this);
                  founder.setText("FOUNDER & ADMIN\nAQIB JAVED\nS/O MUHAMMAD YASEEN");
                  founder.setTextSize(17);
                  founder.setLineSpacing(8,1);
                  founder.setTextColor(Color.WHITE);
                  founder.setGravity(Gravity.CENTER);
                  founder.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  founder.setPadding(0,35,0,0);
                  layout.addView(founder);

                  TextView footer = new TextView(this);
                  footer.setText("POWERED BY COBRA AI TECHNOLOGY");
                  footer.setTextSize(10);
                  footer.setTextColor(Color.rgb(212,175,55));
                  footer.setGravity(Gravity.CENTER);
                  footer.setPadding(0,35,0,0);
                  layout.addView(footer);

                  setContentView(layout);
              }

              void openWebsite() {
                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.BLACK);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://cobra-ai.muhajirhackers.workers.dev/");

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COBRA-AI-PRO-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
